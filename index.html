<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8a5a1e">
<title>磁力小矿工</title>
<style>
/* ============================================================================
   《磁力小矿工》· 幼儿科学课互动小游戏（幼师客户定制单）
   ──────────────────────────────────────────────────────────────────────────
   设计稿 1280×720（平板横屏最佳），外层按屏幕等比缩放，任何设备都不裁画面
   玩法：点场上的物品 → 磁铁滑过去下降 → 是铁、且板子挡不住，才吸得上来

   【素材接入说明（2026-10-16）】
   · 22 张物品图：assets/items/第 N 关物品/{可以吸,不能吸}/xxx.png（客户手绘）
   · 背景：assets/scene/背景-无磁铁.jpg —— 松鼠在洞口那张，磁铁是我们 CSS 画的，
     所以背景必须用「无磁铁」版，否则画面上会出现两个磁铁
   · 彩蛋画板：assets/scene/画板.png（实际是 WebP 格式，客户原件一字未动，别改名）
   ⚠️ 源码里一律写 assets/ 相对路径，方便本地预览；交付版由 build.js 把路径
      换成 base64 内嵌，产出「单文件离线版」—— 客户素材绝不能挂公网

   【客户三条硬要求（2026-10-15），本文件逐条落实】
     ① 错 3 次重新闯关 .............. MISS_LIMIT + renderChances（红色机会点）
     ② 能吸 / 不能吸「间隔摆放」 ..... alternate()：两类交错，不再 shuffle 纯随机
     ③ 吸上来的东西显示在右上角圈内 .. #basket，客户亲手圈的位置（不是松鼠旁边）
   ============================================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#140f0c;color:#fff;
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* ---------- 舞台：固定 1280×720，用 JS 算 scale 居中 ----------
   背景位置必须是 center top：原图 1763×1280 比舞台高，居中裁会把松鼠头顶切掉 */
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;
  transform-origin:50% 50%;border-radius:10px;background-color:#e9a33c;
  background-image:url("assets/scene/背景-无磁铁.jpg");
  background-position:center top;background-size:cover;background-repeat:no-repeat}

/* 压暗层：上半部压暗一点让 HUD 文字读得清，四周加暗角把视线聚到中间 */
.cave{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(rgba(46,26,6,.42),rgba(46,26,6,0) 24%),
    radial-gradient(125% 95% at 50% 46%,rgba(0,0,0,0) 52%,rgba(46,24,4,.30))}

/* ---------- 左上角 HUD：关卡名 / 机会点 / 收集进度 ----------
   原来进度点放右上角，现在右上角让给客户的收集区 ⇒ 整块 HUD 收进左上角两行 */
#hud{position:absolute;left:26px;top:16px;display:flex;flex-direction:column;
  gap:10px;align-items:flex-start;pointer-events:none;z-index:20}
#levelName{font-size:32px;font-weight:800;letter-spacing:1px;color:#fff8e6;
  text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 16px rgba(0,0,0,.45)}
#hudBottom{display:flex;align-items:center;gap:26px}

/* 错误机会指示：客户要求「错 3 次重新闯关」⇒ 把还剩几次画出来，孩子看得见规则 */
#chances{display:flex;gap:10px;align-items:center}
.chance{width:26px;height:26px;border-radius:50%;transition:background .3s,box-shadow .3s,opacity .3s;
  background:radial-gradient(circle at 35% 30%,#ffd77a,#e08a12);
  box-shadow:0 0 10px rgba(255,196,80,.6),0 2px 0 rgba(0,0,0,.35)}
.chance.lost{background:#5a4a38;box-shadow:none;opacity:.55}   /* 用掉的次数：暗下去，不刺眼、不像惩罚 */

/* 收集进度：圆圈比数字直观，孩子看得懂 */
#progress{display:flex;gap:12px;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;border:4px solid rgba(255,240,205,.65);
  background:rgba(0,0,0,.28);transition:transform .25s,background .25s,border-color .25s}
.dot.on{background:radial-gradient(circle at 35% 30%,#ffe08a,#f2a51a);border-color:#ffefc4;
  transform:scale(1.12);box-shadow:0 0 18px rgba(255,196,80,.8)}

/* ---------- 右上角「收集区」：客户亲手圈定的位置 ----------
   ⚠️ 别挪到松鼠旁边 —— 参考图 assets/scene/参考-客户标注收集区.jpg 圈的是右上角
   虚线框 + 半透明底：既让孩子看见「吸到的东西放这儿」，又不挡背景插画 */
#basket{position:absolute;right:22px;top:14px;width:360px;height:152px;z-index:20;
  border:5px dashed rgba(255,244,216,.92);border-radius:26px;pointer-events:none;
  background:rgba(104,62,16,.30);box-shadow:inset 0 0 30px rgba(255,214,140,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#basketLabel{font-size:20px;font-weight:800;letter-spacing:2px;color:#fff4d8;
  text-shadow:0 2px 0 rgba(0,0,0,.45)}
#basketItems{display:flex;gap:8px;align-items:center;justify-content:center;height:64px}
.basketItem{width:60px;height:60px;background-size:contain;background-repeat:no-repeat;
  background-position:center;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));
  animation:pop .36s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.25);opacity:0} to{transform:scale(1);opacity:1}}

/* ---------- 磁铁（CSS 画的马蹄形磁铁，带 N/S） ---------- */
#magnet{position:absolute;left:0;top:0;width:180px;height:150px;will-change:transform;
  pointer-events:none;z-index:40}
#magnet .body{position:absolute;left:0;top:0;width:180px;height:104px;
  border-radius:90px 90px 12px 12px;
  background:linear-gradient(180deg,#ff5b57 0 42%,#e33b38 42% 100%);
  box-shadow:inset -14px 0 24px rgba(0,0,0,.28),0 8px 18px rgba(0,0,0,.45)}
#magnet .leg{position:absolute;top:100px;width:58px;height:46px;border-radius:0 0 8px 8px}
#magnet .leg.l{left:0;background:linear-gradient(#dcdcdc,#9aa0a6)}
#magnet .leg.r{right:0;background:linear-gradient(#dcdcdc,#9aa0a6)}
#magnet .ns{position:absolute;top:20px;left:0;width:100%;display:flex;justify-content:center;
  gap:76px;font-weight:900;font-size:34px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#magnet .glow{position:absolute;left:-16px;top:120px;width:212px;height:70px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(120,200,255,.42),transparent 75%);opacity:0;
  transition:opacity .2s}
#magnet.active .glow{opacity:1}

/* ---------- 场上的卡片：物品图 + 名字 ----------
   图片统一走 background-image（不是 <img>）—— 好处：不用等图片加载事件，
   内嵌成 base64 后立刻显示；小图进收集区时也能直接复用同一个地址 */
.card{position:absolute;width:180px;height:208px;cursor:pointer;transform-origin:50% 80%;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  transition:transform .5s cubic-bezier(.3,0,.2,1),opacity .5s}
.card::after{content:"";position:absolute;inset:-8px;border-radius:26px} /* 放大的点击热区：幼儿点偏一点也算中 */
.card .pic{width:180px;height:180px;background-size:contain;background-repeat:no-repeat;
  background-position:center;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.card .name{margin-top:4px;font-size:22px;font-weight:700;color:#fff6e2;white-space:nowrap;
  background:rgba(58,30,6,.58);padding:2px 14px;border-radius:12px;
  text-shadow:0 2px 0 rgba(0,0,0,.4)}
.card.shake{animation:shake .34s ease}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(-9px) rotate(-4deg)}75%{transform:translateX(9px) rotate(4deg)}}

/* ---------- 弹层（开始 / 过关 / 重来） ---------- */
.layer{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:40px;z-index:80;
  background:radial-gradient(circle at 50% 40%,rgba(72,44,16,.90),rgba(14,8,4,.96))}
.layer.show{display:flex}
.layer h1{font-size:74px;letter-spacing:6px;color:#ffd77a;
  text-shadow:0 5px 0 #7a4a10,0 10px 26px rgba(0,0,0,.6)}
.layer h2{font-size:52px;color:#ffd77a;margin-bottom:10px;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.layer p{font-size:28px;line-height:1.7;color:#ffeccd;margin:14px 0;max-width:980px}
.bigbtn{margin-top:34px;padding:20px 74px;font-size:36px;font-weight:900;letter-spacing:3px;
  color:#5a2f06;border:0;border-radius:999px;cursor:pointer;
  background:linear-gradient(#ffe08a,#f5ad2b);
  box-shadow:0 9px 0 #a76a12,0 16px 26px rgba(0,0,0,.45);transition:transform .08s}
.bigbtn:active{transform:translateY(5px);box-shadow:0 4px 0 #a76a12}
.mini{font-size:22px;color:#e7cfa8;margin-top:26px;line-height:1.6}

/* ---------- 彩蛋：磁力画板（左边实物照片 + 右边动手画） ---------- */
#paint{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:#f7f2e6;z-index:90;padding:14px 22px}
#paint.show{display:flex}
#paint .tip{font-size:27px;font-weight:900;color:#5a4a2a;text-align:center;line-height:1.45}
#paint .tip small{display:block;font-size:20px;font-weight:600;color:#8a7752;margin-top:4px}
#paintBody{display:flex;align-items:center;gap:26px;margin-top:12px}
/* 客户给的画板实物图：960×616，等比缩到 500 宽 */
#boardPic{width:500px;height:321px;background-size:contain;background-repeat:no-repeat;
  background-position:center;border-radius:16px;
  background-image:url("assets/scene/画板.jpg");
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.18))}
#board{width:660px;height:404px;background:#fff;border-radius:16px;
  box-shadow:0 10px 24px rgba(0,0,0,.20),inset 0 0 0 4px #efe3c8;touch-action:none}
#paint .row{display:flex;gap:20px;margin-top:12px}
.pbtn{padding:12px 36px;font-size:25px;font-weight:800;color:#fff;border:0;border-radius:999px;
  background:linear-gradient(#6fb1ff,#2f7fe0);box-shadow:0 6px 0 #1c569e;cursor:pointer}
.pbtn.warm{background:linear-gradient(#ffb35c,#f08a1e);box-shadow:0 6px 0 #a45b0f}
.pbtn:active{transform:translateY(4px);box-shadow:none}
</style>
</head>
<body>
<div id="stage">
  <div class="cave"></div>

  <!-- 左上角：关卡名 + 机会点 + 收集进度 -->
  <div id="hud">
    <div id="levelName">第 1 关 · 矿洞寻宝</div>
    <div id="hudBottom">
      <div id="chances"></div>
      <div id="progress"></div>
    </div>
  </div>

  <!-- 右上角：收集区（客户圈定的位置）—— 吸上来的东西会飞进这里并留下小图 -->
  <div id="basket">
    <div id="basketLabel">吸到的宝贝</div>
    <div id="basketItems"></div>
  </div>

  <!-- 磁铁本体 -->
  <div id="magnet">
    <div class="body"></div>
    <div class="glow"></div>
    <div class="leg l"></div><div class="leg r"></div>
    <div class="ns"><span>N</span><span>S</span></div>
  </div>

  <!-- 摆放物品 / 组合的容器（点击事件委托到它） -->
  <div id="field" style="position:absolute;inset:0"></div>

  <!-- 开始页 -->
  <div class="layer show" id="startLayer">
    <h1>磁力小矿工</h1>
    <p>小松鼠矿工带你下矿洞啦！<br>点一下想吸的东西，看看磁铁能不能把它吸上来～</p>
    <button class="bigbtn" id="startBtn">开始挖宝</button>
    <div class="mini">建议把平板横过来玩</div>
  </div>

  <!-- 过关 / 通关页 -->
  <div class="layer" id="passLayer">
    <h2 id="passTitle">过关啦！</h2>
    <p id="passText"></p>
    <button class="bigbtn" id="passBtn">继续</button>
  </div>

  <!-- 彩蛋：磁力画板（左边客户给的实物图，右边动手画；不要语音，纯画面 + 大字提示） -->
  <div id="paint">
    <div class="tip">我们发现的磁力本领，生活里到处都有！<br>磁力画板就用到磁力 —— 动手画一画，把美好心意送给好朋友吧
      <small>用手指在右边白板上画，点「换颜色」换笔，点「重新画」清空</small></div>
    <div id="paintBody">
      <div id="boardPic"></div>
      <canvas id="board" width="660" height="404"></canvas>
    </div>
    <div class="row">
      <button class="pbtn" id="colorBtn">换颜色</button>
      <button class="pbtn warm" id="clearBtn">重新画</button>
      <button class="pbtn warm" id="againBtn">再玩一次</button>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   1. 基础工具：屏幕适配、等待、随机
   ============================================================================ */
const W = 1280, H = 720;
const stage = document.getElementById('stage');
const field = document.getElementById('field');
const magnet = document.getElementById('magnet');

// 等比缩放：任何屏幕都完整显示 1280×720 的画面（平板横屏最佳）
function fit(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit); window.addEventListener('orientationchange', fit); fit();

const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* 手机竖屏时给一句轻提示（不强制、不打断） */
function portraitHint(){
  if (window.innerHeight > window.innerWidth && window.innerWidth < 820 && !document.getElementById('rotTip')){
    const d = document.createElement('div');
    d.id = 'rotTip';
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:#fff4d8;opacity:.9;z-index:999';
    d.textContent = '把设备横过来，画面更大哦～';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 5000);
  }
}
window.addEventListener('load', portraitHint);

/* ============================================================================
   2. 素材表：客户手绘的 22 张图（路径写成 assets/…，打包时会被换成 base64）
   ----------------------------------------------------------------------------
   为什么用「路径 + 名字」两列而不是直接写文件名：
     客户给的文件名有个错别字（第二关的「泡沐.png」），原件不许改，
     所以 src 用她的真实文件名，name 用给孩子看的正确写法。
   ============================================================================ */
const ART = {
  // 第 1 关：铁制品 5 张 —— 能被磁铁吸住
  lv1Iron: [
    {name:'回形针', src:'assets/items/第一关物品/可以吸/回形针.webp'},
    {name:'燕尾夹', src:'assets/items/第一关物品/可以吸/燕尾夹.webp'},
    {name:'铁螺母', src:'assets/items/第一关物品/可以吸/铁螺母.webp'},
    {name:'铁针',   src:'assets/items/第一关物品/可以吸/铁针.webp'},
    {name:'铁钉',   src:'assets/items/第一关物品/可以吸/铁钉.webp'}
  ],
  // 第 1 关：非铁 5 张 —— 吸不住
  lv1Non: [
    {name:'积木',   src:'assets/items/第一关物品/不能吸/积木.webp'},
    {name:'纸杯',   src:'assets/items/第一关物品/不能吸/纸杯.webp'},
    {name:'钻石',   src:'assets/items/第一关物品/不能吸/钻石.webp'},
    {name:'铜螺母', src:'assets/items/第一关物品/不能吸/铜螺母.webp'},
    {name:'黄金',   src:'assets/items/第一关物品/不能吸/黄金.webp'}
  ],
  // 第 2 关：板子下面压着回形针，整张图就是一组（板 + 物品）
  //   「可以吸」= 这块板挡不住磁力；铁板 metal:true = 挡住
  lv2Iron: [
    {name:'塑料板', src:'assets/items/第二关物品/可以吸/塑料.webp'},
    {name:'木板',   src:'assets/items/第二关物品/可以吸/木板.webp'},
    {name:'泡沫板', src:'assets/items/第二关物品/可以吸/泡沐.webp'},
    {name:'纸板',   src:'assets/items/第二关物品/可以吸/纸板.webp'},
    {name:'铜板',   src:'assets/items/第二关物品/可以吸/铜板.webp'}
  ],
  lv2Non: [
    {name:'铁板', src:'assets/items/第二关物品/不可以吸/铁板.webp', metal:true}
  ],
  // 第 3 关：每张图 = 一块板 + 一个物品，要「东西是铁的」且「板子挡不住」才吸得走
  lv3Iron: [
    {name:'塑料 + 回形针', src:'assets/items/第三关物品/可以吸/塑料+回形针.webp'},
    {name:'木板 + 铁螺母', src:'assets/items/第三关物品/可以吸/木板+铁螺母.webp'},
    {name:'纸板 + 铁钉',   src:'assets/items/第三关物品/可以吸/纸板+铁钉.webp'}
  ],
  lv3Non: [
    {name:'泡沫 + 积木',   src:'assets/items/第三关物品/不可以吸/泡沫+积木.webp'},
    {name:'铁板 + 燕尾夹', src:'assets/items/第三关物品/不可以吸/铁+燕尾夹.webp', metal:true},
    {name:'铁板 + 钻石',   src:'assets/items/第三关物品/不可以吸/铁+钻石.webp',  metal:true}
  ]
};

/* ============================================================================
   3. 音效：全部用 Web Audio 实时合成 —— 不需要任何音频文件，客户零素材负担
      吸住「叮」、落空「噗」、铁板「当」、通关「庆祝」
   ============================================================================ */
let ac = null;
function audio(){
  if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, type='sine', vol=.16, delay=0, slideTo){
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + .03);
}
const sfx = {
  dong(){ tone(880,.12,'sine',.20); tone(1320,.24,'sine',.13,.06); },              // 吸住：叮
  puff(){ tone(170,.20,'sawtooth',.09); tone(110,.24,'triangle',.08,.05); },       // 落空：噗
  clank(){ tone(300,.10,'square',.10); tone(150,.30,'triangle',.12,.03,90); },     // 铁板：当（金属撞击感）
  win(){ [523,659,784,1047].forEach((f,i) => tone(f,.32,'sine',.15,i*.12)); },    // 通关：庆祝
  tap(){ tone(700,.06,'sine',.09); },
  retry(){ tone(620,.16,'sine',.13); tone(830,.26,'sine',.11,.13); }   // 重来：两个明亮的上行音（鼓励感，故意不做挫败音）
};

/* ============================================================================
   4. 舞台坐标常量：全部集中在这里，改布局只动这一段
   ----------------------------------------------------------------------------
   画面 1280×720 被切成三块：
     左上角 HUD（关卡名 + 机会点 + 进度点）  → y < 100
     右上角 收集区（客户圈的位置）          → x 898~1258，y 14~166
     下方　 卡片网格                        → y 266~700
   ⚠️ 磁铁待机位为什么在 y=110 而不是贴顶（y=34）：
      背景里的松鼠头顶在 y 30~210，贴顶会让磁铁整个盖住松鼠；
      下移到 y110 后磁铁压住松鼠下半身 —— 看起来就是「松鼠吊着磁铁」，且不碰卡片（卡片顶边 266）
   ============================================================================ */
const CARD_W = 180, CARD_H = 208;          // 卡片尺寸（图片 180 + 名字一行）
const MX = 640, MY = 110;                  // 磁铁待机位（x 是中心线）：画面顶部正中，松鼠身下
const BASKET_CX = 1078, BASKET_CY = 96;    // 收集区中心（right:22 + 宽 360 ⇒ 中心 x = 1078）

/* 每关的网格：列心 x、行心 y（都按卡片中心算）
   第 1 关 10 张 ⇒ 5 列 2 行；第 2/3 关各 6 张 ⇒ 3 列 2 行（列间距更大，图显得更舒展） */
const GRID = {
  0: {cols:[128, 384, 640, 896, 1152], rows:[370, 596]},
  1: {cols:[320, 640, 960],            rows:[370, 596]},
  2: {cols:[320, 640, 960],            rows:[370, 596]}
};

/* ============================================================================
   5. 磁铁动画：平移过去 → 下降 → 上升回原位
   ============================================================================ */
let magnetPos = { x: MX - 90, y: MY };
function magnetTo(x, y, ms, ease='cubic-bezier(.35,0,.25,1)'){
  magnet.style.transition = `transform ${ms}ms ${ease}`;
  // 磁铁宽 180：传进来的 x 是目标中心线，这里换算成左上角
  magnet.style.transform = `translate(${x - 90}px, ${y}px)`;
  magnetPos = { x: x - 90, y };
  return wait(ms + 30);
}

/* ============================================================================
   6. 游戏状态
   ============================================================================ */
const game = { level:0, collected:0, need:0, busy:false, missStreak:0, missCount:0 };

/* 客户要求（2026-10-15）：「错误 3 次，重新闯关」
   次数按「每一关」单独算 —— 进关清零（见 startLevel），不是全局累计 */
const MISS_LIMIT = 3;

/* 机会指示器：把「还剩几次」画出来，孩子看得见规则，不是突然被打断 */
function renderChances(){
  const box = document.getElementById('chances');
  if (!box) return;
  box.innerHTML = '';
  for (let i = 0; i < MISS_LIMIT; i++){
    const d = document.createElement('div');
    d.className = 'chance' + (i < game.missCount ? ' lost' : '');
    box.appendChild(d);
  }
}

/* 左上角进度圈 */
function renderProgress(){
  const p = document.getElementById('progress');
  p.innerHTML = '';
  for (let i = 0; i < game.need; i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i < game.collected ? ' on' : '');
    p.appendChild(d);
  }
}
function addProgress(){
  game.collected++;
  const dots = document.querySelectorAll('#progress .dot');
  if (dots[game.collected - 1]) dots[game.collected - 1].classList.add('on');
}

/* 右上角收集区：进关清空；每吸上来一件就往里塞一张小图 */
function renderBasket(){
  const box = document.getElementById('basketItems');
  if (box) box.innerHTML = '';
}
function addToBasket(src){
  if (!src) return;
  const box = document.getElementById('basketItems');
  if (!box) return;
  const d = document.createElement('div');
  d.className = 'basketItem';
  d.style.backgroundImage = `url("${src}")`;     // 复用同一张素材，不用另存缩略图
  box.appendChild(d);
}

/* 清场 */
function clearField(){ field.innerHTML = ''; }

/* ============================================================================
   7. 摆放规则：能吸 / 不能吸「间隔摆放」（客户 2026-10-15 第 2 条要求）
   ----------------------------------------------------------------------------
   原来的 shuffle() 全随机，孩子可能连点三次都是同一类，试不出规律。
   现在按「两类交错」摆：
     · 5 能吸 + 5 不能吸 ⇒ 完美棋盘格：可 不 可 不 可 / 不 可 不 可 不
     · 3 + 3（第 3 关）  ⇒ 同样完美交替
     · 5 + 1（第 2 关素材就是「5 块能穿的板 + 1 块铁板」）⇒ 无解也要摆得尽量好：
       把那唯一的铁板放到**邻居最多的格子**（2 行网格里就是第一行中间），
       它能隔开最多对卡片；缩在角落就只能隔开 2 对，孩子沿着看过去不容易撞见，
       「铁板挡磁力」这个知识点就漏掉了。
   做法：少数类按长度均分插进多数类的空隙（取每段中点），剩下位置填多数类。
   ============================================================================ */
function alternate(good, bad, cols){
  const total = good.length + bad.length;
  if (!bad.length) return good.slice();
  if (!good.length) return bad.slice();

  // 谁少谁是「被插入」的那一类（少数类保持在多数类之间，不会挤成一堆）
  const minorFirst = bad.length <= good.length;
  const minor = minorFirst ? bad : good;
  const major = minorFirst ? good : bad;

  const out = new Array(total);

  if (minor.length === 1 && cols > 0){
    // 只有一张少数类：挑「四邻里在网格内最多的那一格」
    const rows = Math.ceil(total / cols);
    let best = 0, bestDeg = -1;
    for (let i = 0; i < total; i++){
      const r = Math.floor(i / cols), c = i % cols;
      const deg = (r > 0 ? 1 : 0) + (r < rows - 1 ? 1 : 0) + (c > 0 ? 1 : 0) + (c < cols - 1 ? 1 : 0);
      if (deg > bestDeg){ bestDeg = deg; best = i; }
    }
    out[best] = minor[0];
  } else {
    const step = total / minor.length;
    const used = new Set();
    minor.forEach((it, i) => {
      let p = Math.min(total - 1, Math.round(step * i + step / 2 - .5));   // 第 i 段的中间位置
      while (used.has(p)) p = Math.min(total - 1, p + 1);                   // 撞位就往后挪一格
      used.add(p); out[p] = it;
    });
  }

  let k = 0;
  for (let i = 0; i < total; i++) if (!out[i]) out[i] = major[k++];
  return out;
}

/* ============================================================================
   8. 关卡数据：每关 = 能吸的一堆 + 不能吸的一堆，摆的位置由 GRID 决定
   ============================================================================ */
const LEVELS = [
  {
    name:'第 1 关 · 矿洞寻宝', need:5,
    good: ART.lv1Iron.map(o => ({...o, iron:true})),
    bad:  ART.lv1Non.map(o => ({...o, iron:false})),
    intro:'把铁做的东西吸上来吧！',
    done:'磁铁能吸住铁做的东西，吸不住塑料、纸、钻石和铜'
  },
  {
    name:'第 2 关 · 隔障寻宝', need:5,
    good: ART.lv2Iron.map(o => ({...o, iron:true})),
    bad:  ART.lv2Non.map(o => ({...o, iron:false})),
    intro:'宝藏被板子盖住啦！',
    done:'磁力能穿过大多数板子，但铁板会把它牢牢挡住'
  },
  {
    name:'第 3 关 · 综合大矿脉', need:3,
    good: ART.lv3Iron.map(o => ({...o, iron:true})),
    bad:  ART.lv3Non.map(o => ({...o, iron:false})),
    intro:'要看两件事：东西是铁的，板子还挡不住！',
    done:'又能吸住铁、又能穿过板子，两个条件都要满足才行'
  }
];

/* ============================================================================
   9. 建卡片 + 按 GRID 铺开
   ----------------------------------------------------------------------------
   💡 桩测试（test/fail-rule.test.js）用的最小 DOM 没有 querySelector，
      所以这里只允许用 getElementById / createElement —— 改代码时别踩这个坑
   ============================================================================ */
/* ⚠️ 2026-10-16 客户反馈（毛毛转述）：**第 2 关、第 3 关卡片下面的名字不要**
   （他红圈标出来的就是这些字）—— 第 1 关保留，认铁那关孩子要看着名字认。
   💡 不显示名字时卡片就变成正方形（CARD_W），**高度和居中偏移必须一起改**：
      若仍按旧的 CARD_H 居中，图片会视觉偏上 14px（差的那半行名字）。 */
function makeCard(it, x, y, showName = true){
  const h = showName ? CARD_H : CARD_W;      // 有名字 = 208（图 180 + 一行字），没名字 = 180
  const el = document.createElement('div');
  el.className = 'card';
  el.style.width  = CARD_W + 'px';
  el.style.height = h + 'px';
  el.style.left = (x - CARD_W / 2) + 'px';
  el.style.top  = (y - h / 2) + 'px';
  el.dataset.cx = x;              // 磁铁要对准卡片中心
  el.dataset.cy = y;
  el.dataset.src = it.src;        // 吸走后要拿它往收集区放小图

  const pic = document.createElement('div');
  pic.className = 'pic';
  pic.style.backgroundImage = `url("${it.src}")`;
  el.appendChild(pic);

  if (showName){                              // 第 2、3 关客户明确不要名字 ⇒ 连 DOM 都不建
    const nm = document.createElement('div');
    nm.className = 'name';
    nm.textContent = it.name;
    el.appendChild(nm);
  }

  el.addEventListener('click', () => onPickItem(el, it));
  return el;
}

/* 把「间隔摆放」好的列表按行列铺到场上（行优先：先填满第一行再填第二行） */
function buildLevel(i){
  clearField();
  const L = LEVELS[i];
  const cols = GRID[i].cols, rows = GRID[i].rows;
  const items = alternate(L.good, L.bad, cols.length);   // 把列数告诉它，单张少数类才能挑到"最中间"的格子
  items.forEach((it, n) => {
    const col = n % cols.length, row = Math.floor(n / cols.length);
    const x = cols[col] + rand(-7, 7);      // 轻微错落，保持手绘感；位移很小，不会重叠、不影响点击
    const y = rows[row] + rand(-5, 5);
    field.appendChild(makeCard(it, x, y, i === 0));   // 只有第 1 关显示名字（第 2、3 关客户要求去掉）
  });
}

/* ============================================================================
   10. 核心：点一下 → 磁铁过去 → 吸住 / 落空
   ============================================================================ */
async function onPickItem(el, data){
  if (game.busy || game.clearing || el.dataset.done) return;   // 动画 / 过关期间锁输入，防小朋友连环乱点
  game.busy = true;
  audio();

  const cx = +el.dataset.cx, cy = +el.dataset.cy;
  const canPick = !!data.iron;                 // 素材表里已经算好「这块板挡不挡得住 + 东西是不是铁」

  // ① 平移过去
  await magnetTo(cx, MY, 380);
  // ② 下降
  magnet.classList.add('active');
  await magnetTo(cx, cy - 132, 340);

  if (canPick){
    // 吸住了！
    sfx.dong();
    await wait(160);
    el.dataset.done = '1';

    // ③ 一边跟着磁铁升起来，一边飞向右上角的收集区（两种运动合成一段动画，孩子看得出「被收走了」）
    el.style.transformOrigin = '50% 50%';                          // 缩放要绕中心，否则会飘
    el.style.transform = `translate(${BASKET_CX - cx}px, ${BASKET_CY - cy}px) scale(.3)`;
    el.style.opacity = '0';
    await magnetTo(cx, MY, 520, 'cubic-bezier(.2,.9,.3,1)');

    addToBasket(el.dataset.src);                                    // 收集区里出现一张小图
    addProgress();
    game.missStreak = 0;
    await wait(140);
    el.remove();
  } else {
    // 吸不动：铁板「当」一声（带金属感），其它非铁物品「噗」一声
    if (data.metal) sfx.clank(); else sfx.puff();
    el.classList.add('shake');
    if (game.level === 2) game.missStreak++;
    game.missCount++;              // 本关错误次数 +1（客户要求：满 3 次重新闯关）
    renderChances();
    await wait(360);
    el.classList.remove('shake');
    await magnetTo(cx, MY, 420);
  }

  magnet.classList.remove('active');
  await magnetTo(MX, MY, 320);
  game.busy = false;

  // 收集够了 → 过关（用 clearing 锁住，防孩子在弹层出现前继续点击、重复触发过关）
  if (game.collected >= game.need){ game.clearing = true; await levelClear(); return; }

  // 错误次数用满 → 这一关重新来（客户 2026-10-15 要求：「错误 3 次，重新闯关」）
  if (game.missCount >= MISS_LIMIT){ game.clearing = true; await levelRestart(); }
}

/* 错误满 3 次：温柔地请孩子重来这一关 —— 不出现「失败」字样、不放挫败音 */
async function levelRestart(){
  await wait(420);
  sfx.retry();
  showLayer('哎呀，再来一次～',
    `这一关试了 ${MISS_LIMIT} 次都没吸上来<br><b>没关系，我们重新来一遍！</b>`,
    '重新闯这一关', () => startLevel(game.level));
}

/* ============================================================================
   11. 关卡流程
   ============================================================================ */
async function startLevel(i){
  game.level = i; game.collected = 0; game.missStreak = 0; game.missCount = 0;
  game.busy = false; game.clearing = false;
  renderChances();                    // 每关开局都把 3 个机会点亮
  const L = LEVELS[i];
  game.need = L.need;
  document.getElementById('levelName').textContent = L.name;
  renderProgress();
  renderBasket();                     // 收集区清空，重新开始攒
  clearField();
  await magnetTo(MX, MY, 300);
  buildLevel(i);
}

function showLayer(title, text, btnText, cb){
  const lay = document.getElementById('passLayer');
  document.getElementById('passTitle').textContent = title;
  document.getElementById('passText').innerHTML = text;
  const btn = document.getElementById('passBtn');
  btn.textContent = btnText;
  lay.classList.add('show');
  btn.onclick = () => { lay.classList.remove('show'); sfx.tap(); cb && cb(); };
}

async function levelClear(){
  await wait(520);
  sfx.win();
  const i = game.level;
  if (i < 2){
    const next = LEVELS[i + 1];
    showLayer('过关啦！',
      `${LEVELS[i].name}完成 · 我们发现了：<br><b>${LEVELS[i].done}</b><br><br>接下来：${next.name}`,
      '进入下一关', () => startLevel(i + 1));
  } else {
    showLayer('全部闯关完成！', '你已经是合格的磁力小矿工啦 🎉<br>接下来，我们一起来看看磁力画板～',
      '看看彩蛋', () => openPaint());
  }
}

/* ============================================================================
   12. 彩蛋：磁力画板（左边放客户给的画板实物图，右边用手指画）
   ============================================================================ */
const COLORS = ['#e94b3c','#f5a623','#2f7fe0','#28a745','#8e44ad','#111111'];
let colorIdx = 0, painting = false;
function openPaint(){
  document.getElementById('paint').classList.add('show');
  const cv = document.getElementById('board'), ctx = cv.getContext('2d');
  ctx.lineCap = ctx.lineJoin = 'round'; ctx.lineWidth = 10;

  function pos(e){
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x:(t.clientX - r.left) * (cv.width / r.width), y:(t.clientY - r.top) * (cv.height / r.height) };
  }
  function down(e){ e.preventDefault(); painting = true; ctx.beginPath(); ctx.strokeStyle = COLORS[colorIdx]; const p = pos(e); ctx.moveTo(p.x, p.y); }
  function move(e){ if (!painting) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
  function up(){ painting = false; }
  cv.addEventListener('pointerdown', down); cv.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  cv.addEventListener('touchstart', down, {passive:false}); cv.addEventListener('touchmove', move, {passive:false});
  cv.addEventListener('touchend', up);
  document.getElementById('colorBtn').onclick = () => { colorIdx = (colorIdx + 1) % COLORS.length; sfx.tap(); };
  document.getElementById('clearBtn').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); sfx.tap(); };
  document.getElementById('againBtn').onclick = () => {           // 从第 1 关重玩
    sfx.tap();
    ctx.clearRect(0, 0, cv.width, cv.height);
    document.getElementById('paint').classList.remove('show');
    startLevel(0);
  };
}

/* ============================================================================
   13. 启动
   ============================================================================ */
document.getElementById('startBtn').onclick = () => {
  audio(); sfx.tap();
  document.getElementById('startLayer').classList.remove('show');
  startLevel(0);
};
magnet.style.transform = `translate(${MX - 90}px, ${MY}px)`;
</script>
